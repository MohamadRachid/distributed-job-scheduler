# CI — tests only. This pipeline DEPLOYS NOTHING.
#
# It runs the same four checks every increment has been verified with by hand
# since W1, on every push
# and every pull request to main. There is no release, publish, or deploy step
# anywhere in this file, and none should be added without a recorded decision:
# the project claims continuous *integration*, never continuous delivery.
#
# The four checks, and where each one runs:
#   1. control-plane suite  -> INSIDE the pinned 3.12 container, via the repo's
#                              own docker-compose.yml (the canonical
#                              environment). Postgres comes from compose, so
#                              both SKIP LOCKED proofs run instead of skipping.
#   2. ruff                 -> on the runner, over the product code.
#   3. agent suite          -> on the runner. The agent is host software and its
#                              tests are host-side (§13); they monkeypatch
#                              docker.from_env, so no daemon is needed.
#   4. web tests + build    -> on the runner, npm ci + npm test + vite build.
#
# WHAT IS DELIBERATELY NOT HERE (named, not hidden — a green tick on a check that
# does not really test anything is worse than an honest gap):
#   * scripts/ is NOT linted. `ruff check scripts` currently reports 6 pre-existing
#     findings (4 x E401/E702 in patch_hub_status.py, F401 + E741 in
#     report_check.py). Those are report-tooling, not the product, and this
#     pipeline will not silence them by weakening a source file. Add scripts/ to
#     the lint step once they are fixed.
#   * scripts/chaos_test.py (the no-duplicate proof) does not run here. It drives
#     a live stack and is the centerpiece evidence captured by hand into
#     docs/evidence/chaos_test_output.txt; automating it is future work, not a
#     thing to fake.
#   * Nothing needing a real GPU, a second physical machine, or the W7a
#     measurement harness runs here. Those are measurements, not tests, and their
#     numbers are only honest on an idle dedicated machine.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push makes an in-flight run pointless. Cancelling it keeps the signal
# current and does not burn Actions minutes on a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  control-plane-tests:
    name: Control-plane suite (canonical 3.12 container)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The canonical command from §13, unchanged:
      #   docker compose run --rm control-plane pytest -q
      # `run` starts control-plane's depends_on (postgres, gated on its own
      # healthcheck) and nothing else — minio is not a dependency and pgadmin sits
      # behind the `tools` profile, so neither starts.
      #
      # TEST_DATABASE_URL is the difference between 0 skipped and 2 skipped. The
      # two Postgres proofs guard SELECT ... FOR UPDATE SKIP LOCKED, which SQLite
      # cannot express at all, so without a real Postgres they skip and the exact
      # property that is this project's contribution goes untested. The URL is the
      # one already documented in README.md, resolved on the compose network.
      - name: Run the suite (both SKIP LOCKED proofs included)
        run: |
          docker compose run --rm \
            -e TEST_DATABASE_URL=postgresql+asyncpg://fyp:fyp@postgres:5432/fyp \
            control-plane pytest -q

      - name: Tear down
        if: always()
        run: docker compose down -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned on purpose. ruff ships new rules often, and an unpinned linter
      # turns someone else's release into a red build on code nobody touched.
      - name: Install ruff
        run: pip install ruff==0.15.20

      # The product code. See the header for why scripts/ is not in this list.
      - name: Lint control-plane, agent, workloads
        run: ruff check control-plane agent workloads

  agent-tests:
    name: Agent suite (host-side)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # agent/runner.py imports the docker SDK at module level and the sysinfo
      # path imports psutil, so both packages must be present. The DAEMON is not
      # needed: these tests monkeypatch docker.from_env (agent/tests/test_runner_logs.py).
      - name: Install agent deps
        run: |
          pip install -r agent/requirements-dev.txt

      - name: Run agent tests
        run: pytest agent/tests -q

  web-build:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` (not install) so the build uses the committed lockfile exactly.
      - name: Install
        working-directory: web
        run: npm ci

      - name: Test dashboard behavior
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
